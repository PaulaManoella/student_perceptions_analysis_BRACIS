[tool.poetry]
name = "avalia-analysis"
package-mode = false
version = "0.1.0"
authors = ["pmano <pmanoella1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pandas = "^3.0.1"
nltk = "^3.9.3"
spacy = "^3.8.11"
openpyxl = "^3.1.5"
gensim = "^4.4.0"
scikit-learn = "^1.8.0"
torch = {version = "^2.10.0+cpu", source = "pytorch-cpu"}
bertopic = "^0.17.4"
sentence-transformers = "^5.2.3"
umap-learn = "^0.5.11"
llama-cpp-python = "^0.3.16"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"
cosine-similarity = "^0.1.2"
network = "^0.1"
python-louvain = "^0.16"
ruff = "^0.15.10"
rbo = "^0.1.3"
pdf2image = "^1.17.0"
ipykernel = "^7.2.0"


[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle 
    "F",   # pyflakes 
    "I",   # isort 
    "N",   # pep8-naming
    "B",   # flake8-bugbear 
    "UP",  # pyupgrade 
    "SIM", # flake8-simplify 
    "C90", # mccabe 
    "PT",  # flake8-pytest-style 
    "RET", # flake8-return 
]

ignore = []
[tool.ruff.lint.mccabe]
max-complexity = 10
